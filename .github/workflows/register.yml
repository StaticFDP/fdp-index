name: Register FDP from issue

# Turns a "Register a FAIR Data Point" issue (label: fdp-registration) into a branch that
# adds the FDP to registry.yaml, and opens a pull request. Editing the issue updates it.
#
# The issue body is untrusted input: it only reaches the script through a file,
# never through ${{ }} expansion inside a shell script.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: register-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  register:
    if: contains(github.event.issue.labels.*.name, 'fdp-registration') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      GH_TOKEN: ${{ github.token }}
      BRANCH: registry/issue-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - name: Add the FDP to registry.yaml
        id: gen
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue.md"
          if python scripts/register_from_issue.py --issue-body "$RUNNER_TEMP/issue.md" \
               --summary "$RUNNER_TEMP/pr.md" --title-file "$RUNNER_TEMP/title.txt" \
               2> "$RUNNER_TEMP/error.txt"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a problem with the form
        if: steps.gen.outputs.ok == 'false'
        run: |
          {
            echo "I could not register this FDP:"
            echo
            echo '```'
            tail -n 5 "$RUNNER_TEMP/error.txt"
            echo '```'
            echo
            echo "Edit the issue to fix it; this check runs again automatically."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          exit 1

      - name: Push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add registry.yaml
          git commit -m "$(cat "$RUNNER_TEMP/title.txt")" -m "Generated from issue #$ISSUE_NUMBER."
          git push --force origin "$BRANCH"

      - name: Open or update the pull request
        run: |
          printf '\n\nCloses #%s\n' "$ISSUE_NUMBER" >> "$RUNNER_TEMP/pr.md"
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$(cat "$RUNNER_TEMP/title.txt")" --body-file "$RUNNER_TEMP/pr.md"
            gh issue comment "$ISSUE_NUMBER" --body "Updated pull request #$existing from the edited issue."
          elif gh pr create --base main --head "$BRANCH" --title "$(cat "$RUNNER_TEMP/title.txt")" --body-file "$RUNNER_TEMP/pr.md"; then
            gh issue comment "$ISSUE_NUMBER" --body "Opened a pull request for this registration: $(gh pr view "$BRANCH" --json url --jq .url)"
          else
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            {
              echo "The registry entry is ready on branch \`$BRANCH\`."
              echo
              echo "**[Open the pull request]($compare)** (GitHub Actions is not allowed to open it in this repository)."
              echo
              cat "$RUNNER_TEMP/pr.md"
            } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          fi
