# FDP Registry
# One entry per FAIR Data Point root resource.
#
# Fields:
#   url:     FDP root URL — must be reachable over HTTPS (required)
#   label:   human-readable name (optional, discovered from metadata if absent)
#   added:   ISO 8601 date first registered
#   contact: maintainer (optional)
#   notes:   any known quirks for the crawler (optional)
#
# Only add URLs that are actually deployed and reachable.
# Use workflow_dispatch ("Run workflow") to test a new entry manually.

fdps:

  # ── Live FDPs — confirmed reachable ───────────────────────────────────────

  - url:     https://fdp.duchennedatafoundation.org
    label:   "Duchenne FAIR Data Point"
    added:   "2026-04-16"
    contact: ""

  - url:     https://fdp.wikipathways.org/index.ttl
    label:   "WikiPathways FAIR Data Point"
    added:   "2026-04-16"
    contact: ""

  - url:     https://fdp.dcc.sib.swiss
    label:   "SPHN FAIR Data Point (SIB Swiss)"
    added:   "2026-04-16"
    contact: "fair-data-team@sib.swiss"
    notes:   >
      Internal IRIs use http:// while the server is https://.
      Label/description extraction falls back to URL string — data is complete.
      Has 15 catalogs; ensure MAX_HOPS is set high enough.

  - url:     https://rajaramzfdp.fdpcloud.org/fdp-content/repository
    label:   "rajaramz-fdp demo"
    added:   "2026-04-16"
    contact: ""

