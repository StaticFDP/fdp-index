# FDP Registry
# One entry per FAIR Data Point root resource.
#
# Fields:
#   url:     FDP root URL — must be reachable over HTTPS (required)
#   label:   human-readable name (optional, discovered from metadata if absent)
#   added:   ISO 8601 date first registered
#   contact: maintainer (optional)
#
# NOTE: only add URLs that are actually deployed and reachable.
# Entries for FDPs not yet deployed on fdpCloud will cause crawl errors.
# Use workflow_dispatch ("Run workflow") to test a new entry manually before
# committing it here.

fdps:

  # ── Live FDPs on fdpcloud.org ──────────────────────────────────────────────

  - url:     https://rajaramzfdp.fdpcloud.org/fdp-content/repository
    label:   "rajaramz-fdp demo"
    added:   "2026-04-16"
    contact: ""

